  <main>

    <section class="section">
      <div class="wrap--narrow center stack">
        <h1 class="display display--xl">Rad stuff on walls and canvas</h1>
      </div>
    </section>

    <!-- ========== GALLERY ==========
       To add a piece: copy one <figure> block, change the image path,
       the alt text, the data-category, and the caption. Nothing else.
       The filters and lightbox pick it up automatically. -->
    <section class="wrap">
      <div class="filters" data-filters>
        <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
        <button class="filter" type="button" data-filter="murals" aria-pressed="false">Murals</button>
        <button class="filter" type="button" data-filter="studio" aria-pressed="false">Studio</button>
      </div>

      <div class="grid">

        <figure data-category="murals" class="reveal">
          <button class="tile" type="button" data-caption="Shuttle bus mural, Route of Hiawatha, Lookout Pass, ID">
            <img src="assets/img/RouteofH.jpg" data-full="assets/img/RouteofH.jpg, assets/img/RouteofH2.jpg"
              loading="lazy" decoding="async" alt="Shuttle bus mural, Route of Hiawatha, Lookout Pass, ID">
          </button>
          <figcaption class="caption">Shuttle bus mural, Route of Hiawatha, ID
          </figcaption>
        </figure>

        <figure data-category="studio" class="reveal">
          <button class="tile" type="button" data-caption="lifes a Marathon, marker on paper">
            <img src="assets/img/Doodle1.jpg" data-full="assets/img/Doodle1.jpg" loading="lazy" decoding="async"
              alt="lifes a Marathon, marker on paper">
          </button>
          <figcaption class="caption">Lifes a Marathon, marker on paper</figcaption>
        </figure>

        <figure data-category="murals" class="reveal">
          <button class="tile" type="button" data-caption="Gittels Grocery, Coeur d'Alene, ID">
            <img src="assets/img/Gittels.jpg"
              data-full="assets/img/Gittels.jpg, assets/img/Gittels2.jpg, assets/img/Gittels3.jpg, assets/img/Gittels4.jpg"
              loading="lazy" decoding="async" alt="Gittels Grocery Mural">
          </button>
          <figcaption class="caption">Mural at <em>Gittel's Grocery</em>, Coeur d'Alene, ID</figcaption>
        </figure>

        <figure data-category="studio" class="reveal">

        </figure>

        <figure data-category="murals" class="reveal">

        </figure>

        <figure data-category="studio" class="reveal">
